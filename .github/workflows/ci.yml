name: ci
build-and-push:
name: Build, Scan, Push (FE & BE)
runs-on: ubuntu-latest
permissions:
contents: read
packages: write # allow push to GHCR
security-events: write # for SARIF uploads (optional)

strategy:
matrix:
service: [frontend, backend]
include:
- service: frontend
context: ./frontend
image: ghcr.io/${{ github.repository_owner }}/hello-frontend
- service: backend
context: ./backend
image: ghcr.io/${{ github.repository_owner }}/hello-backend

steps:
- name: Checkout
uses: actions/checkout@v4

- name: Set up QEMU (for multi-arch, optional now)
uses: docker/setup-qemu-action@v3

- name: Set up Buildx
uses: docker/setup-buildx-action@v3

- name: Login to GHCR
uses: docker/login-action@v3
with:
registry: ghcr.io
username: ${{ github.repository_owner }}
password: ${{ secrets.GITHUB_TOKEN }}

- name: Extract metadata (tags, labels)
id: meta
uses: docker/metadata-action@v5
with:
images: ${{ matrix.image }}
tags: |
type=sha,prefix=sha-,format=long
labels: |
org.opencontainers.image.source=${{ github.repository }}

- name: Build & Push image
id: build
uses: docker/build-push-action@v6
with:
context: ${{ matrix.context }}
push: true
platforms: linux/amd64 # keep single-arch for speed now
tags: ${{ steps.meta.outputs.tags }}
labels: ${{ steps.meta.outputs.labels }}
cache-from: type=gha
cache-to: type=gha,mode=max

- name: Trivy scan (image)
uses: aquasecurity/trivy-action@0.24.0
with:
image-ref: ${{ matrix.image }}:${{ steps.meta.outputs.version }}
format: sarif
output: trivy-${{ matrix.service }}.sarif
vuln-type: "os,library"
ignore-unfixed: true
severity: HIGH,CRITICAL

- name: Upload SARIF to GitHub Security (optional)
uses: github/codeql-action/upload-sarif@v3
if: always()
with:
sarif_file: trivy-${{ matrix.service }}.sarif