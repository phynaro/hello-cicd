name: deploy-staging

on:
  workflow_run:
    workflows: ["ci"]
    branches: [ main ]
    types: [completed]

env:
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  deploy-frontend:
    name: Deploy frontend (dmz)
    runs-on: [self-hosted, FE]     # ← frontend VM labels                    # BE first (flip if you prefer FE first)
    environment:
      name: production                               # optional: add reviewers here
    steps:
      - name: Pull & restart frontend
        shell: bash
        run: |
          set -e
          cd /opt/hello-cicd/frontend
          export REPO_OWNER="${{ env.REPO_OWNER }}"
          export IMAGE_SHA="${{ github.sha }}"
          # export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"    # if GHCR is private
          ./deploy_frontend.sh
